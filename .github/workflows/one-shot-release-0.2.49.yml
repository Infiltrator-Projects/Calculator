name: One-shot Calculator 0.2.49 metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-release-0.2.49.yml
      - support/release/one_shot_0_2_49.py

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Advance authoritative release metadata
        run: python3 support/release/one_shot_0_2_49.py
      - name: Commit immutable 0.2.49 release source
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-release-0.2.49.yml support/release/one_shot_0_2_49.py
          git add VERSION debian/changelog CHANGELOG.md debian/calculator.metainfo.xml
          git diff --cached --check
          git config user.name 'The-First-Infiltrator'
          git config user.email 'The-First-Infiltrator@users.noreply.github.com'
          git commit -m 'Release Calculator 0.2.49'
          git push origin HEAD:main
