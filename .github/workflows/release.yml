name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            debhelper-compat \
            dpkg-dev \
            g++ \
            libgtk-4-dev \
            pkg-config

      - name: Verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          test "$version" = "$(dpkg-parsechangelog -S Version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Calculator version: $version"

      - name: Verify compact Linux desktop layout
        run: python3 tests/test_desktop_layout.py

      - name: Build and test on Linux
        run: |
          set -euo pipefail
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF
          cmake --build build-linux --parallel
          ctest --test-dir build-linux --output-on-failure

      - name: Build Debian package
        run: |
          set -euo pipefail
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          mkdir -p dist/linux
          cp ../infiltrator-calc_${{ steps.version.outputs.version }}_amd64.deb "dist/linux/calculator_${{ steps.version.outputs.version }}_amd64.deb"
          dpkg-deb --info "dist/linux/calculator_${{ steps.version.outputs.version }}_amd64.deb"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: calculator-linux-amd64
          path: dist/linux/*
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure native Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VERSION is empty' }

          cmake -S . -B build-windows -A x64 `
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF

      - name: Build and test on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-windows --config Release --parallel
          ctest --test-dir build-windows -C Release --output-on-failure

          $exe = 'build-windows/Release/infiltrator-calc.exe'
          if (-not (Test-Path $exe)) { throw "Missing Windows executable: $exe" }

      - name: Smoke-test native Windows keypad creation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build-windows/Release/infiltrator-calc.exe').Path

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          using System.Text;

          [StructLayout(LayoutKind.Sequential)]
          public struct RECT {
              public int Left;
              public int Top;
              public int Right;
              public int Bottom;
          }

          [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
          public struct LOGFONT {
              public int lfHeight;
              public int lfWidth;
              public int lfEscapement;
              public int lfOrientation;
              public int lfWeight;
              public byte lfItalic;
              public byte lfUnderline;
              public byte lfStrikeOut;
              public byte lfCharSet;
              public byte lfOutPrecision;
              public byte lfClipPrecision;
              public byte lfQuality;
              public byte lfPitchAndFamily;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
              public string lfFaceName;
          }

          public static class CalcSmoke {
              public delegate bool EnumChildProc(IntPtr hwnd, IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern bool EnumChildWindows(IntPtr parent, EnumChildProc callback, IntPtr lParam);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetClassName(IntPtr hwnd, StringBuilder className, int maxCount);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetWindowText(IntPtr hwnd, StringBuilder text, int maxCount);

              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(IntPtr hwnd);

              [DllImport("user32.dll")]
              public static extern IntPtr SendMessage(IntPtr hwnd, uint msg, IntPtr wParam, IntPtr lParam);

              [DllImport("user32.dll")]
              public static extern bool GetClientRect(IntPtr hwnd, out RECT rect);

              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);

              [DllImport("gdi32.dll", CharSet = CharSet.Unicode)]
              public static extern int GetObject(IntPtr handle, int size, out LOGFONT logfont);
          }
          "@

          $process = Start-Process $exe -PassThru
          try {
            $null = $process.WaitForInputIdle(5000)
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Milliseconds 100
              $process.Refresh()
              if ($process.HasExited) { throw "Windows calculator exited during startup with code $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) { break }
            }
            if ($process.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Windows calculator did not create a main window' }

            $buttons = [System.Collections.Generic.List[System.IntPtr]]::new()
            $children = [System.Collections.Generic.List[System.IntPtr]]::new()
            $callback = [CalcSmoke+EnumChildProc]{
              param([IntPtr]$hwnd, [IntPtr]$lParam)
              $children.Add($hwnd)
              $name = [System.Text.StringBuilder]::new(64)
              [void][CalcSmoke]::GetClassName($hwnd, $name, $name.Capacity)
              if ($name.ToString() -ieq 'Button') { $buttons.Add($hwnd) }
              return $true
            }
            [void][CalcSmoke]::EnumChildWindows($process.MainWindowHandle, $callback, [IntPtr]::Zero)

            if ($buttons.Count -lt 100) {
              throw "Windows keypad smoke test found only $($buttons.Count) child buttons; expected the mode controls and full calculator key grids"
            }

            $client = New-Object RECT
            if (-not [CalcSmoke]::GetClientRect($process.MainWindowHandle, [ref]$client)) {
              throw 'Could not read Windows calculator client geometry'
            }
            $clientWidth = $client.Right - $client.Left
            $clientHeight = $client.Bottom - $client.Top
            if ($clientWidth -gt 380 -or $clientHeight -gt 630) {
              throw "Windows calculator default client area regressed to ${clientWidth}x${clientHeight}"
            }

            function Get-ButtonByText([string]$label) {
              foreach ($hwnd in $buttons) {
                $text = [System.Text.StringBuilder]::new(64)
                [void][CalcSmoke]::GetWindowText($hwnd, $text, $text.Capacity)
                if ($text.ToString() -ceq $label) { return $hwnd }
              }
              return [IntPtr]::Zero
            }

            function Get-VisibleButtonByText([string]$label) {
              foreach ($hwnd in $buttons) {
                if (-not [CalcSmoke]::IsWindowVisible($hwnd)) { continue }
                $text = [System.Text.StringBuilder]::new(64)
                [void][CalcSmoke]::GetWindowText($hwnd, $text, $text.Capacity)
                if ($text.ToString() -ceq $label) { return $hwnd }
              }
              return [IntPtr]::Zero
            }

            function Get-VisibleButtonCount {
              $count = 0
              foreach ($hwnd in $buttons) {
                if ([CalcSmoke]::IsWindowVisible($hwnd)) { $count++ }
              }
              return $count
            }

            $theme = Get-ButtonByText 'System'
            $standard = Get-ButtonByText 'Standard'
            $scientific = Get-ButtonByText 'Scientific'
            $programmer = Get-ButtonByText 'Programmer'
            if ($theme -eq [IntPtr]::Zero -or $standard -eq [IntPtr]::Zero -or
                $scientific -eq [IntPtr]::Zero -or $programmer -eq [IntPtr]::Zero) {
              throw 'Windows theme/mode buttons were not found'
            }

            [void][CalcSmoke]::SendMessage($theme, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 80
            $themeText = [System.Text.StringBuilder]::new(64)
            [void][CalcSmoke]::GetWindowText($theme, $themeText, $themeText.Capacity)
            if ($themeText.ToString() -ne 'Day') {
              throw "Windows theme cycle failed: System did not advance to Day (got '$($themeText.ToString())')"
            }
            [void][CalcSmoke]::SendMessage($theme, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 80
            [void]$themeText.Clear()
            [void][CalcSmoke]::GetWindowText($theme, $themeText, $themeText.Capacity)
            if ($themeText.ToString() -ne 'Night') {
              throw "Windows theme cycle failed: Day did not advance to Night (got '$($themeText.ToString())')"
            }
            [void][CalcSmoke]::SendMessage($theme, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 80

            $initialVisible = Get-VisibleButtonCount
            [void][CalcSmoke]::SendMessage($scientific, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 100
            $scientificVisible = Get-VisibleButtonCount
            [void][CalcSmoke]::SendMessage($programmer, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 100
            $programmerVisible = Get-VisibleButtonCount
            [void][CalcSmoke]::SendMessage($standard, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 100
            $standardVisible = Get-VisibleButtonCount

            if ($initialVisible -ne 33 -or $scientificVisible -ne 45 -or
                $programmerVisible -ne 45 -or $standardVisible -ne 33) {
              throw "Windows mode switching visibility contract failed: initial=$initialVisible scientific=$scientificVisible programmer=$programmerVisible standard=$standardVisible"
            }

            $memoryButton = Get-VisibleButtonByText 'MC'
            $percentButton = Get-VisibleButtonByText '%'
            if ($memoryButton -eq [IntPtr]::Zero -or $percentButton -eq [IntPtr]::Zero) {
              throw 'Windows standard memory/operator controls were not found'
            }
            $memoryRect = New-Object RECT
            $percentRect = New-Object RECT
            [void][CalcSmoke]::GetWindowRect($memoryButton, [ref]$memoryRect)
            [void][CalcSmoke]::GetWindowRect($percentButton, [ref]$percentRect)
            if ($memoryRect.Top -ge $percentRect.Top -or
                ($percentRect.Top - $memoryRect.Bottom) -gt 8) {
              throw "Windows standard memory strip is not compactly separated above the keypad"
            }

            $three = Get-VisibleButtonByText '3'
            $plus = Get-VisibleButtonByText '+'
            $equals = Get-VisibleButtonByText '='
            if ($three -eq [IntPtr]::Zero -or $plus -eq [IntPtr]::Zero -or $equals -eq [IntPtr]::Zero) {
              throw 'Windows standard arithmetic buttons were not found'
            }
            [void][CalcSmoke]::SendMessage($three, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
            [void][CalcSmoke]::SendMessage($plus, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
            [void][CalcSmoke]::SendMessage($three, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
            [void][CalcSmoke]::SendMessage($equals, 0x00F5, [IntPtr]::Zero, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 100

            $sixVisible = $false
            foreach ($hwnd in $children) {
              if (-not [CalcSmoke]::IsWindowVisible($hwnd)) { continue }
              $name = [System.Text.StringBuilder]::new(64)
              $text = [System.Text.StringBuilder]::new(128)
              [void][CalcSmoke]::GetClassName($hwnd, $name, $name.Capacity)
              [void][CalcSmoke]::GetWindowText($hwnd, $text, $text.Capacity)
              if ($name.ToString() -ieq 'Static' -and $text.ToString() -ceq '6') {
                $sixVisible = $true
                break
              }
            }
            if (-not $sixVisible) {
              throw 'Windows UI arithmetic smoke test failed: 3 + 3 did not display 6'
            }

            $title = [IntPtr]::Zero
            foreach ($hwnd in $children) {
              $name = [System.Text.StringBuilder]::new(64)
              $text = [System.Text.StringBuilder]::new(128)
              [void][CalcSmoke]::GetClassName($hwnd, $name, $name.Capacity)
              [void][CalcSmoke]::GetWindowText($hwnd, $text, $text.Capacity)
              if ($name.ToString() -ieq 'Static' -and $text.ToString() -ceq 'Calculator') {
                $title = $hwnd
                break
              }
            }
            if ($title -eq [IntPtr]::Zero) { throw 'Windows title control was not found' }

            $fontHandle = [CalcSmoke]::SendMessage($title, 0x0031, [IntPtr]::Zero, [IntPtr]::Zero)
            $font = New-Object LOGFONT
            $fontSize = [Runtime.InteropServices.Marshal]::SizeOf([type][LOGFONT])
            if ($fontHandle -eq [IntPtr]::Zero -or
                [CalcSmoke]::GetObject($fontHandle, $fontSize, [ref]$font) -eq 0) {
              throw 'Windows title font could not be inspected'
            }
            if ($font.lfFaceName -notin @('Segoe UI', 'MB Corpo A Title Cond WEB')) {
              throw "Unexpected Windows title font fallback: $($font.lfFaceName)"
            }

            Write-Host "Windows UI smoke test passed: ${clientWidth}x${clientHeight}, theme cycling, compact memory strip, mode switching and 3+3 functional path correct, title font $($font.lfFaceName)."
          }
          finally {
            if ($null -ne $process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Verify standalone Windows dependency boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build-windows/Release/infiltrator-calc.exe').Path
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }

          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual Studio C++ tools not found' }

          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $dumpbin) { throw 'dumpbin.exe not found' }

          $imports = (& $dumpbin.FullName /dependents $exe | Out-String)
          $imports

          $forbidden = @(
            'libgcc', 'libstdc++', 'libwinpthread',
            'libgtk', 'libglib', 'libgobject', 'libgio',
            'libpango', 'libcairo', 'libharfbuzz',
            'libfontconfig', 'libfreetype',
            'VCRUNTIME', 'MSVCP'
          )
          foreach ($name in $forbidden) {
            if ($imports -match [regex]::Escape($name)) {
              throw "Standalone Windows boundary violated by dependency: $name"
            }
          }

      - name: Package standalone Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path 'dist/windows' | Out-Null
          Copy-Item 'build-windows/Release/infiltrator-calc.exe' "dist/windows/calculator_${version}_windows_x64.exe"
          if (-not (Test-Path "dist/windows/calculator_${version}_windows_x64.exe")) {
            throw 'Windows release executable was not packaged'
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: calculator-windows-x64
          path: dist/windows/calculator_*_windows_x64.exe
          if-no-files-found: error


  ios:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install iOS project generator
        run: brew install xcodegen

      - name: Build and test shared core on macOS
        run: |
          set -euo pipefail
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCALCULATOR_BUILD_DESKTOP=OFF \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF
          cmake --build build-macos --parallel
          ctest --test-dir build-macos --output-on-failure

      - name: Generate and build iPhone app
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"

          (
            cd ios
            xcodegen generate --spec project.yml
          )

          xcodebuild \
            -project ios/Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$version" \
            build

          app="$(find build-ios/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          test -d "$app"

          mkdir -p dist/ios
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "dist/ios/calculator_${version}_ios-simulator.zip"

      - name: Build unsigned iPhone device app
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"

          xcodebuild \
            -project ios/Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$version" \
            build

          app="$(find build-ios-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          test -d "$app"

          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "dist/ios/calculator_${version}_ios-device-unsigned.zip"

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calculator-ios
          path: |
            dist/ios/calculator_*_ios-simulator.zip
            dist/ios/calculator_*_ios-device-unsigned.zip
          if-no-files-found: error

  publish:
    needs: [linux, windows, ios]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: calculator-linux-amd64
          path: dist/linux

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: calculator-windows-x64
          path: dist/windows

      - name: Download iOS package
        uses: actions/download-artifact@v4
        with:
          name: calculator-ios
          path: dist/ios

      - name: Verify cross-platform release assets
        env:
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/linux/calculator_${VERSION}_amd64.deb"
          test -f "dist/windows/calculator_${VERSION}_windows_x64.exe"
          test -f "dist/ios/calculator_${VERSION}_ios-simulator.zip"
          test -f "dist/ios/calculator_${VERSION}_ios-device-unsigned.zip"

          sha256sum \
            "dist/linux/calculator_${VERSION}_amd64.deb" \
            "dist/windows/calculator_${VERSION}_windows_x64.exe" \
            "dist/ios/calculator_${VERSION}_ios-simulator.zip" \
            "dist/ios/calculator_${VERSION}_ios-device-unsigned.zip" \
            > dist/SHA256SUMS.txt

      - name: Publish immutable cross-platform GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "dist/linux/calculator_${VERSION}_amd64.deb" \
            "dist/windows/calculator_${VERSION}_windows_x64.exe" \
            "dist/ios/calculator_${VERSION}_ios-simulator.zip" \
            "dist/ios/calculator_${VERSION}_ios-device-unsigned.zip" \
            "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Calculator ${VERSION}" \
            --generate-notes \
            --latest

  apt-publication:
    needs: [linux, windows, publish]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refresh and verify Package Repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          APP_ID: infiltrator-calc
          VERSION: ${{ needs.linux.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERSION"
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" \
            '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"

          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if ! curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches; then
              echo "::warning::Immediate APT dispatch failed; waiting for the repository safety refresh."
            fi
          else
            echo "::warning::APT dispatch token is unavailable; waiting for the repository safety refresh."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done

          echo "::error::The central APT repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1


  repository-rename:
    needs: [apt-publication]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ') && github.repository == 'Infiltrator-Projects/Infiltrator-Calc'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Rename GitHub repository to Calculator
        env:
          ADMIN_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          payload='{"name":"Calculator"}'

          try_token() {
            local token="$1"
            local label="$2"
            [[ -n "$token" ]] || return 1
            code="$(curl -sS -o response.json -w '%{http_code}' \
              --request PATCH \
              --header "Authorization: Bearer $token" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              "$endpoint")"
            if [[ "$code" == "200" ]]; then
              echo "Repository renamed with $label: $(jq -r .full_name response.json)"
              return 0
            fi
            echo "::warning::$label could not rename repository (HTTP $code): $(jq -r '.message // "unknown error"' response.json 2>/dev/null || echo unknown)"
            return 1
          }

          if try_token "${ADMIN_TOKEN:-}" "stored cross-repository credential"; then
            exit 0
          fi
          if try_token "${DEFAULT_TOKEN:-}" "GitHub Actions token"; then
            exit 0
          fi

          echo "::warning::No available workflow credential has repository-administration permission."
