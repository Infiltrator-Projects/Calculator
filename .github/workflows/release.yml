name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            debhelper-compat \
            dpkg-dev \
            g++ \
            libgtk-4-dev \
            pkg-config

      - name: Verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          test "$version" = "$(dpkg-parsechangelog -S Version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Infiltrator Calc version: $version"

      - name: Build and test on Linux
        run: |
          set -euo pipefail
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF
          cmake --build build-linux --parallel
          ctest --test-dir build-linux --output-on-failure

      - name: Build Debian package
        run: |
          set -euo pipefail
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          mkdir -p dist/linux
          cp ../infiltrator-calc_${{ steps.version.outputs.version }}_amd64.deb dist/linux/
          dpkg-deb --info dist/linux/infiltrator-calc_${{ steps.version.outputs.version }}_amd64.deb

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-calc-linux-amd64
          path: dist/linux/*
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            zip

      - name: Build and test on Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"

          cmake -S . -B build-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF
          cmake --build build-windows --parallel
          ctest --test-dir build-windows --output-on-failure
          test -f build-windows/infiltrator-calc.exe

      - name: Build Windows executable and portable runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          out="dist/windows"
          runtime="$out/infiltrator-calc-${version}-windows-x64"
          mkdir -p "$runtime"

          cp build-windows/infiltrator-calc.exe \
            "$out/infiltrator-calc_${version}_windows_x64.exe"
          cp build-windows/infiltrator-calc.exe \
            "$runtime/infiltrator-calc.exe"

          # Copy the complete transitive UCRT64 DLL closure beside the EXE.
          queue=("build-windows/infiltrator-calc.exe")
          while (("${#queue[@]}" > 0)); do
            file="${queue[0]}"
            queue=("${queue[@]:1}")
            while IFS= read -r dep; do
              [[ "$dep" == /ucrt64/bin/* ]] || continue
              base="$(basename "$dep")"
              if [[ ! -f "$runtime/$base" ]]; then
                cp "$dep" "$runtime/$base"
                queue+=("$runtime/$base")
              fi
            done < <(ldd "$file" | awk '{for(i=1;i<=NF;i++) if ($i ~ /^\/ucrt64\/bin\//) print $i}')
          done

          # Preserve runtime data GTK/GLib may discover relative to the DLL prefix.
          for rel in \
            share/glib-2.0/schemas \
            etc/fonts \
            share/fontconfig \
            share/icons/Adwaita \
            share/icons/hicolor \
            lib/gdk-pixbuf-2.0; do
            if [[ -e "/ucrt64/$rel" ]]; then
              mkdir -p "$runtime/$(dirname "$rel")"
              cp -a "/ucrt64/$rel" "$runtime/$rel"
            fi
          done

          cat > "$runtime/README-WINDOWS.txt" <<'EOF'
          Infiltrator Calc for Windows x64

          Run infiltrator-calc.exe from this folder.
          The bundled DLL and runtime-data files are the native GTK/GLib
          dependencies required by the Windows build.
          EOF

          (
            cd "$out"
            zip -qr "infiltrator-calc_${version}_windows_x64_portable.zip" \
              "infiltrator-calc-${version}-windows-x64"
          )

          test -f "$out/infiltrator-calc_${version}_windows_x64.exe"
          test -f "$out/infiltrator-calc_${version}_windows_x64_portable.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-calc-windows-x64
          path: |
            dist/windows/infiltrator-calc_*_windows_x64.exe
            dist/windows/infiltrator-calc_*_windows_x64_portable.zip
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: infiltrator-calc-linux-amd64
          path: dist/linux

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: infiltrator-calc-windows-x64
          path: dist/windows

      - name: Verify cross-platform release assets
        env:
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/linux/infiltrator-calc_${VERSION}_amd64.deb"
          test -f "dist/windows/infiltrator-calc_${VERSION}_windows_x64.exe"
          test -f "dist/windows/infiltrator-calc_${VERSION}_windows_x64_portable.zip"

          sha256sum \
            "dist/linux/infiltrator-calc_${VERSION}_amd64.deb" \
            "dist/windows/infiltrator-calc_${VERSION}_windows_x64.exe" \
            "dist/windows/infiltrator-calc_${VERSION}_windows_x64_portable.zip" \
            > dist/SHA256SUMS.txt

      - name: Publish immutable cross-platform GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "dist/linux/infiltrator-calc_${VERSION}_amd64.deb" \
            "dist/windows/infiltrator-calc_${VERSION}_windows_x64.exe" \
            "dist/windows/infiltrator-calc_${VERSION}_windows_x64_portable.zip" \
            "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Infiltrator Calc ${VERSION}" \
            --generate-notes \
            --latest

  apt-publication:
    needs: [linux, windows, publish]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refresh and verify Infiltrator APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          APP_ID: infiltrator-calc
          VERSION: ${{ needs.linux.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERSION"
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" \
            '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"

          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if ! curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches; then
              echo "::warning::Immediate APT dispatch failed; waiting for the repository safety refresh."
            fi
          else
            echo "::warning::APT dispatch token is unavailable; waiting for the repository safety refresh."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done

          echo "::error::The central APT repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1
