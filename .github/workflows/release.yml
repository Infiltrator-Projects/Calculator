name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            debhelper-compat \
            dpkg-dev \
            g++ \
            libgtk-4-dev \
            pkg-config

      - name: Verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          test "$version" = "$(dpkg-parsechangelog -S Version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Infiltrator Calc version: $version"

      - name: Build and test on Linux
        run: |
          set -euo pipefail
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF
          cmake --build build-linux --parallel
          ctest --test-dir build-linux --output-on-failure

      - name: Build Debian package
        run: |
          set -euo pipefail
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          mkdir -p dist/linux
          cp ../infiltrator-calc_${{ steps.version.outputs.version }}_amd64.deb dist/linux/
          dpkg-deb --info dist/linux/infiltrator-calc_${{ steps.version.outputs.version }}_amd64.deb

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-calc-linux-amd64
          path: dist/linux/*
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure native Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'VERSION is empty' }

          cmake -S . -B build-windows -A x64 `
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF

      - name: Build and test on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-windows --config Release --parallel
          ctest --test-dir build-windows -C Release --output-on-failure

          $exe = 'build-windows/Release/infiltrator-calc.exe'
          if (-not (Test-Path $exe)) { throw "Missing Windows executable: $exe" }

      - name: Verify standalone Windows dependency boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'build-windows/Release/infiltrator-calc.exe').Path
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }

          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual Studio C++ tools not found' }

          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $dumpbin) { throw 'dumpbin.exe not found' }

          $imports = (& $dumpbin.FullName /dependents $exe | Out-String)
          $imports

          $forbidden = @(
            'libgcc', 'libstdc++', 'libwinpthread',
            'libgtk', 'libglib', 'libgobject', 'libgio',
            'libpango', 'libcairo', 'libharfbuzz',
            'libfontconfig', 'libfreetype',
            'VCRUNTIME', 'MSVCP'
          )
          foreach ($name in $forbidden) {
            if ($imports -match [regex]::Escape($name)) {
              throw "Standalone Windows boundary violated by dependency: $name"
            }
          }

      - name: Package standalone Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path 'dist/windows' | Out-Null
          Copy-Item 'build-windows/Release/infiltrator-calc.exe' "dist/windows/infiltrator-calc_${version}_windows_x64.exe"
          if (-not (Test-Path "dist/windows/infiltrator-calc_${version}_windows_x64.exe")) {
            throw 'Windows release executable was not packaged'
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-calc-windows-x64
          path: dist/windows/infiltrator-calc_*_windows_x64.exe
          if-no-files-found: error


  ios:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install iOS project generator
        run: brew install xcodegen

      - name: Build and test shared core on macOS
        run: |
          set -euo pipefail
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DINFILTRATOR_CALC_BUILD_DESKTOP=OFF \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF
          cmake --build build-macos --parallel
          ctest --test-dir build-macos --output-on-failure

      - name: Generate and build iPhone app
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"

          (
            cd ios
            xcodegen generate --spec project.yml
          )

          xcodebuild \
            -project ios/InfiltratorCalcIOS.xcodeproj \
            -scheme InfiltratorCalcIOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$version" \
            build

          app="$(find build-ios/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          test -d "$app"

          mkdir -p dist/ios
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "dist/ios/infiltrator-calc_${version}_ios-simulator.zip"

      - name: Build unsigned iPhone device app
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"

          xcodebuild \
            -project ios/InfiltratorCalcIOS.xcodeproj \
            -scheme InfiltratorCalcIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$version" \
            build

          app="$(find build-ios-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          test -d "$app"

          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "dist/ios/infiltrator-calc_${version}_ios-device-unsigned.zip"

      - name: Upload iOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-calc-ios
          path: |
            dist/ios/infiltrator-calc_*_ios-simulator.zip
            dist/ios/infiltrator-calc_*_ios-device-unsigned.zip
          if-no-files-found: error

  publish:
    needs: [linux, windows, ios]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: infiltrator-calc-linux-amd64
          path: dist/linux

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: infiltrator-calc-windows-x64
          path: dist/windows

      - name: Download iOS package
        uses: actions/download-artifact@v4
        with:
          name: infiltrator-calc-ios
          path: dist/ios

      - name: Verify cross-platform release assets
        env:
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          set -euo pipefail
          test -f "dist/linux/infiltrator-calc_${VERSION}_amd64.deb"
          test -f "dist/windows/infiltrator-calc_${VERSION}_windows_x64.exe"
          test -f "dist/ios/infiltrator-calc_${VERSION}_ios-simulator.zip"
          test -f "dist/ios/infiltrator-calc_${VERSION}_ios-device-unsigned.zip"

          sha256sum \
            "dist/linux/infiltrator-calc_${VERSION}_amd64.deb" \
            "dist/windows/infiltrator-calc_${VERSION}_windows_x64.exe" \
            "dist/ios/infiltrator-calc_${VERSION}_ios-simulator.zip" \
            "dist/ios/infiltrator-calc_${VERSION}_ios-device-unsigned.zip" \
            > dist/SHA256SUMS.txt

      - name: Publish immutable cross-platform GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "dist/linux/infiltrator-calc_${VERSION}_amd64.deb" \
            "dist/windows/infiltrator-calc_${VERSION}_windows_x64.exe" \
            "dist/ios/infiltrator-calc_${VERSION}_ios-simulator.zip" \
            "dist/ios/infiltrator-calc_${VERSION}_ios-device-unsigned.zip" \
            "dist/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Infiltrator Calc ${VERSION}" \
            --generate-notes \
            --latest

  apt-publication:
    needs: [linux, windows, publish]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refresh and verify Infiltrator APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          APP_ID: infiltrator-calc
          VERSION: ${{ needs.linux.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERSION"
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" \
            '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"

          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if ! curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches; then
              echo "::warning::Immediate APT dispatch failed; waiting for the repository safety refresh."
            fi
          else
            echo "::warning::APT dispatch token is unavailable; waiting for the repository safety refresh."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done

          echo "::error::The central APT repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1
