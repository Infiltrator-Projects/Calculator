name: Verify and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or reconcile the current VERSION after verification
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calculator-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release: ${{ steps.metadata.outputs.release }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate metadata and release intent
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          args=(
            --event "$EVENT_NAME"
            --before "${BEFORE_SHA:-}"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "${MANUAL_PUBLISH:-false}" == "true" ]]; then
            args+=(--manual-publish)
          fi
          python3 support/release/release_metadata.py "${args[@]}"

      - name: Validate release support scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n support/ci/verify_debian_package.sh
          bash -n support/ci/linux_idle_cpu.sh
          bash -n support/release/build_source_bundle.sh
          bash -n support/release/build_native_installer.sh
          bash -n support/release/check_apt_publication.sh
          python3 -m py_compile \
            support/release/release_metadata.py \
            support/release/release_assets.py

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            build-essential \
            cmake \
            debhelper-compat \
            dpkg-dev \
            g++ \
            libgtk-4-dev \
            libmpc-dev \
            libmpfr-dev \
            pkg-config \
            xvfb

      - name: Compile native installer tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-installer-tools
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -static \
            support/tools/native_installer.cpp \
            -o build-installer-tools/calculator-native-installer
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            support/tools/build_native_installer.cpp \
            -o build-installer-tools/build-native-installer
          build-installer-tools/calculator-native-installer --help >/dev/null
          build-installer-tools/build-native-installer --help >/dev/null

      - name: Verify Common integration contract
        run: python3 tests/test_common_contract.py

      - name: Verify source modularity contract
        run: python3 tests/test_source_structure.py

      - name: Verify compact Linux desktop layout
        run: python3 tests/test_desktop_layout.py

      - name: Validate AppStream metadata
        run: appstreamcli validate debian/infiltrator-calculator.metainfo.xml

      - name: Build and test on Linux
        run: |
          set -euo pipefail
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF \
            -DCALCULATOR_ENABLE_MPFR_ORACLE_TESTS=ON
          cmake --build build-linux --parallel
          ctest --test-dir build-linux --output-on-failure

      - name: Build and verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          mkdir -p dist/linux
          package="dist/linux/calculator_${VERSION}_amd64.deb"
          cp "../infiltrator-calculator_${VERSION}_amd64.deb" "$package"
          bash support/ci/verify_debian_package.sh "$package"

      - name: Smoke-test packaged Linux idle CPU
        run: bash support/ci/linux_idle_cpu.sh "dist/linux/calculator_${VERSION}_amd64.deb"

      - name: Upload Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculator-linux-amd64
          path: dist/linux/*
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure native Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-windows -A x64 `
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF

      - name: Build and test on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-windows --config Release --parallel
          ctest --test-dir build-windows -C Release --output-on-failure
          if (-not (Test-Path 'build-windows/Release/infiltrator-calc.exe')) {
            throw 'Missing Windows executable'
          }

      - name: Verify native Windows runtime and dependency boundary
        shell: pwsh
        run: pwsh -NoProfile -File support/ci/windows_smoke.ps1 -Executable build-windows/Release/infiltrator-calc.exe

      - name: Package standalone Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'dist/windows' | Out-Null
          $target = "dist/windows/calculator_${env:VERSION}_windows_x64.exe"
          Copy-Item 'build-windows/Release/infiltrator-calc.exe' $target
          if (-not (Test-Path $target)) { throw 'Windows release executable was not packaged' }

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculator-windows-x64
          path: dist/windows/calculator_*_windows_x64.exe
          if-no-files-found: error

  ios:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install iOS project generator
        run: brew install xcodegen

      - name: Build and test shared core on macOS
        run: |
          set -euo pipefail
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCALCULATOR_BUILD_DESKTOP=OFF \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF
          cmake --build build-macos --parallel
          ctest --test-dir build-macos --output-on-failure

      - name: Generate and build iPhone Simulator app
        run: |
          set -euo pipefail
          (cd ios && xcodegen generate --spec project.yml)
          xcodebuild \
            -project ios/Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            build
          app="$(find build-ios/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app" && test -d "$app"
          plutil -extract CFBundleIcons xml1 -o - "$app/Info.plist" >/dev/null

      - name: Build unsigned iPhone device IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            build

          app="$(find build-ios-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app" && test -d "$app"
          ipa_root="$RUNNER_TEMP/calculator-ipa"
          rm -rf "$ipa_root"
          mkdir -p "$ipa_root/Payload" dist/ios
          ditto "$app" "$ipa_root/Payload/Calculator.app"
          ipa="$GITHUB_WORKSPACE/dist/ios/calculator_${VERSION}_ios-device-unsigned.ipa"
          (cd "$ipa_root" && /usr/bin/zip -qry "$ipa" Payload)
          test -f "$ipa"
          /usr/bin/unzip -l "$ipa" | grep -q 'Payload/Calculator.app/Info.plist'
          plutil -extract CFBundleIdentifier raw -o - "$ipa_root/Payload/Calculator.app/Info.plist" \
            | grep -qx 'net.ssmith.infiltrator.calc'

      - name: Upload iOS IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculator-ios
          path: dist/ios/calculator_*_ios-device-unsigned.ipa
          if-no-files-found: error

  sanitizers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Clang ASan and UBSan build
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCALCULATOR_BUILD_DESKTOP=OFF \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build and test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cmake --build build-sanitizers --parallel
          ctest --test-dir build-sanitizers --output-on-failure

  publish:
    needs: [prepare, linux, windows, ios, sanitizers]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout exact release source and Common dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Linux package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: calculator-linux-amd64
          path: dist/linux

      - name: Download Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: calculator-windows-x64
          path: dist/windows

      - name: Download iOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: calculator-ios
          path: dist/ios

      - name: Build deterministic source bundle
        run: bash support/release/build_source_bundle.sh "$VERSION" "$GITHUB_SHA" "dist/source/calculator_${VERSION}_source.tar.gz"

      - name: Build hardware-native installer
        run: bash support/release/build_native_installer.sh "$VERSION" "dist/source/calculator_${VERSION}_source.tar.gz" "dist/native/infiltrator-calculator-${VERSION}-native-installer.run"

      - name: Validate release asset set
        run: |
          set -euo pipefail
          cp LICENSE dist/LICENSE.txt
          python3 support/release/release_assets.py --version "$VERSION" --dist dist

      - name: Publish or reconcile cross-platform GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < dist/release-assets.txt
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists; reconciling the verified asset set."
            gh release upload "$tag" \
              "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Calculator ${VERSION}" \
              --latest
          else
            gh release create "$tag" \
              "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Calculator ${VERSION}" \
              --generate-notes \
              --latest
          fi

  apt-publication:
    name: Check central APT publication
    needs: [prepare, publish]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout publication helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check Package Repository publication
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          APP_ID: infiltrator-calc
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash support/release/check_apt_publication.sh
