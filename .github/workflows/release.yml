name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            debhelper-compat \
            dpkg-dev \
            g++ \
            libgtk-4-dev \
            pkg-config

      - name: Verify release version
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          test "$version" = "$(dpkg-parsechangelog -S Version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Infiltrator Calc version: $version"

      - name: Build and test
        run: |
          set -euo pipefail
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci --parallel
          ctest --test-dir build-ci --output-on-failure

      - name: Build Debian package
        run: |
          set -euo pipefail
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../infiltrator-calc_${{ steps.version.outputs.version }}_amd64.deb dist/
          dpkg-deb --info dist/infiltrator-calc_${{ steps.version.outputs.version }}_amd64.deb
          sha256sum dist/infiltrator-calc_${{ steps.version.outputs.version }}_amd64.deb > dist/SHA256SUMS.txt

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: infiltrator-calc-${{ steps.version.outputs.version }}-amd64-deb
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release ')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "dist/infiltrator-calc_${VERSION}_amd64.deb" \
            "dist/SHA256SUMS.txt" \
            --title "Infiltrator Calc ${VERSION}" \
            --generate-notes

      - name: Refresh and verify Infiltrator APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          APP_ID: infiltrator-calc
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERSION"
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" \
            '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"

          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if ! curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches; then
              echo "::warning::Immediate APT dispatch failed; waiting for the repository safety refresh."
            fi
          else
            echo "::warning::APT dispatch token is unavailable; waiting for the repository safety refresh."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done

          echo "::error::The central APT repository did not advertise $APP_ID $VERSION within 12 minutes."
          exit 1
