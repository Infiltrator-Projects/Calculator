name: Verify and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or reconcile the current VERSION after verification
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calculator-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release: ${{ steps.metadata.outputs.release }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate metadata and release intent
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          args=(
            --event "$EVENT_NAME"
            --before "${BEFORE_SHA:-}"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "${MANUAL_PUBLISH:-false}" == "true" ]]; then
            args+=(--manual-publish)
          fi
          python3 support/release/release_metadata.py "${args[@]}"

      - name: Validate release support scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n support/ci/verify_debian_package.sh
          bash -n support/ci/linux_idle_cpu.sh
          bash -n support/release/build_source_bundle.sh
          bash -n support/release/build_native_installer.sh
          bash -n support/release/check_apt_publication.sh
          python3 -m py_compile \
            support/release/release_metadata.py \
            support/release/prepare_release.py \
            support/release/release_assets.py
          python3 support/release/prepare_release.py --help >/dev/null

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            build-essential \
            cmake \
            debhelper-compat \
            dpkg-dev \
            g++ \
            libgtk-4-dev \
            libmpc-dev \
            libmpfr-dev \
            pkg-config \
            xvfb

      - name: Compile native installer tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-installer-tools
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -static \
            support/tools/native_installer.cpp \
            -o build-installer-tools/calculator-native-installer
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            support/tools/build_native_installer.cpp \
            -o build-installer-tools/build-native-installer
          build-installer-tools/calculator-native-installer --help >/dev/null
          build-installer-tools/build-native-installer --help >/dev/null

      - name: Verify Common integration contract
        run: python3 tests/test_common_contract.py

      - name: Verify source modularity contract
        run: python3 tests/test_source_structure.py

      - name: Verify compact Linux desktop layout
        run: python3 tests/test_desktop_layout.py

      - name: Validate AppStream metadata
        run: appstreamcli validate debian/infiltrator-calculator.metainfo.xml

      - name: Build and test on Linux
        run: |
          set -euo pipefail
          cmake -S . -B build-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF \
            -DCALCULATOR_ENABLE_MPFR_ORACLE_TESTS=ON
          cmake --build build-linux --parallel
          ctest --test-dir build-linux --output-on-failure

      - name: Build and verify Debian package
        shell: bash
        run: support/ci/verify_debian_package.sh "$VERSION" dist/linux

      - name: Smoke-test packaged Linux idle CPU
        shell: bash
        run: support/ci/linux_idle_cpu.sh "dist/linux/calculator_${VERSION}_amd64.deb"

      - name: Upload Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calculator-linux-amd64
          path: dist/linux/*
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure native Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-windows -A x64 `
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF

      - name: Build and test on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-windows --config Release --parallel
          ctest --test-dir build-windows -C Release --output-on-failure

      - name: Verify native Windows runtime and dependency boundary
        shell: pwsh
        run: support/ci/windows_smoke.ps1 -BuildDirectory build-windows

      - name: Package standalone Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item build-windows/Release/infiltrator-calc.exe "dist/windows/calculator_${env:VERSION}_windows_x64.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calculator-windows-x64
          path: dist/windows/*
          if-no-files-found: error

  ios:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install iOS project generator
        run: brew install xcodegen

      - name: Build and test shared core on macOS
        run: |
          set -euo pipefail
          cmake -S . -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF
          cmake --build build-macos --parallel
          ctest --test-dir build-macos --output-on-failure

      - name: Generate and build iPhone Simulator app
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate
          xcodebuild \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ../build-ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone device IPA
        run: |
          set -euo pipefail
          cd ios
          xcodebuild \
            -project Calculator.xcodeproj \
            -scheme Calculator \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build-ios-device \
            CODE_SIGNING_ALLOWED=NO \
            build
          cd ..
          app="build-ios-device/Build/Products/Release-iphoneos/Calculator.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "net.ssmith.infiltrator.calc"
          rm -rf dist/ios/Payload
          mkdir -p dist/ios/Payload
          cp -R "$app" dist/ios/Payload/Calculator.app
          (
            cd dist/ios
            zip -qry "calculator_${VERSION}_ios-device-unsigned.ipa" Payload
          )
          unzip -t "dist/ios/calculator_${VERSION}_ios-device-unsigned.ipa"
          unzip -l "dist/ios/calculator_${VERSION}_ios-device-unsigned.ipa" | grep -F 'Payload/Calculator.app/'
          rm -rf dist/ios/Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calculator-ios-device
          path: dist/ios/*.ipa
          if-no-files-found: error

  sanitizers:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source and Common dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Configure Clang ASan and UBSan build
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug \
            -DINFILTRATR_COMMON_BUILD_SHARED=OFF \
            -DCALCULATOR_ENABLE_SANITIZERS=ON
          cmake --build build-sanitizers --parallel

      - name: Build and test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  package:
    name: Assemble release assets
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, linux, windows, ios, sanitizers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout exact source and Common dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download Linux package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: calculator-linux-amd64
          path: dist/release

      - name: Download Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: calculator-windows-x64
          path: dist/release

      - name: Download iOS package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: calculator-ios-device
          path: dist/release

      - name: Build deterministic source bundle
        shell: bash
        run: support/release/build_source_bundle.sh "$VERSION" dist/release

      - name: Build native Linux installer
        shell: bash
        run: support/release/build_native_installer.sh "$VERSION" dist/release

      - name: Add licence and canonical checksums
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE dist/release/LICENSE.txt
          python3 support/release/release_assets.py \
            --directory dist/release \
            --version "$VERSION" \
            --write-checksums

      - name: Upload assembled release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calculator-release-assets
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish and reconcile GitHub release
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download canonical release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: calculator-release-assets
          path: dist/release

      - name: Verify canonical asset manifest
        run: |
          set -euo pipefail
          python3 support/release/release_assets.py \
            --directory dist/release \
            --version "$VERSION" \
            --verify-checksums

      - name: Publish or reconcile release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes_file="$(mktemp)"
          python3 support/release/release_assets.py \
            --directory dist/release \
            --version "$VERSION" \
            --release-notes > "$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
            gh release edit "$tag" \
              --title "Calculator ${VERSION}" \
              --notes-file "$notes_file" \
              --latest
          else
            gh release create "$tag" dist/release/* \
              --target "$GITHUB_SHA" \
              --title "Calculator ${VERSION}" \
              --notes-file "$notes_file" \
              --latest
          fi

          gh release view "$tag" --json tagName,targetCommitish,name,assets

      - name: Check central APT publication
        shell: bash
        run: support/release/check_apt_publication.sh "$VERSION"
