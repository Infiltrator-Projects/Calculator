name: HAL evaluation budget integration

on:
  push:
    branches: [hal/evaluation-budget-0.2.40]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run evaluation budget integration patcher'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 support/maintenance/apply_evaluation_budget_finish.py

      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name 'HAL'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete shared evaluation budget integration'
          git push origin HEAD:hal/evaluation-budget-0.2.40
