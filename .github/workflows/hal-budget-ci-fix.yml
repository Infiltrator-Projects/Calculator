name: HAL evaluation budget CI fix

on:
  push:
    branches: [hal/evaluation-budget-0.2.40]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run evaluation budget CI fixer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Apply deterministic fixes
        run: python3 support/maintenance/fix_budget_ci.py

      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name 'HAL'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix evaluation budget platform contracts'
          git push origin HEAD:hal/evaluation-budget-0.2.40
