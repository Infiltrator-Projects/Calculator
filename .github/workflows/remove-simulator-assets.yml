name: Remove published iOS Simulator assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-simulator-assets.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove simulator assets and refresh checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for version in 0.1.19 0.1.20 0.1.21 0.1.22; do
            tag="v${version}"
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"

            simulator_id="$(jq -r --arg name "calculator_${version}_ios-simulator.zip"               '.assets[] | select(.name == $name) | .id' <<<"$release_json")"
            if [[ -n "$simulator_id" ]]; then
              gh api --method DELETE                 "repos/${GITHUB_REPOSITORY}/releases/assets/${simulator_id}"
              echo "Removed calculator_${version}_ios-simulator.zip"
            fi

            tmp="$(mktemp -d)"
            gh release download "$tag"               --repo "$GITHUB_REPOSITORY"               --dir "$tmp"               --pattern "calculator_${version}_amd64.deb"               --pattern "calculator_${version}_windows_x64.exe"               --pattern "calculator_${version}_ios-device-unsigned.zip"

            (
              cd "$tmp"
              sha256sum                 "calculator_${version}_amd64.deb"                 "calculator_${version}_windows_x64.exe"                 "calculator_${version}_ios-device-unsigned.zip"                 > SHA256SUMS.txt
            )

            checksum_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"               --jq '.assets[] | select(.name == "SHA256SUMS.txt") | .id')"
            if [[ -n "$checksum_id" ]]; then
              gh api --method DELETE                 "repos/${GITHUB_REPOSITORY}/releases/assets/${checksum_id}"
            fi
            gh release upload "$tag" "$tmp/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"
            rm -rf "$tmp"
          done
