name: Calculator

options:
  bundleIdPrefix: net.ssmith.infiltrator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_C_LANGUAGE_STANDARD: "c11"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Calculator:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Bridge
      - path: ../src/core/calculator.cpp
      - path: ../src/core/calculator.hpp
      - path: ../src/core/session.cpp
      - path: ../src/core/session.hpp
      - path: ../src/core/programmer.cpp
      - path: ../src/core/programmer.hpp
      - path: ../src/infiltratr-common/src/core.c
      - path: ../src/infiltratr-common/src/arithmetic.c
      - path: ../src/infiltratr-common/src/config.c
      - path: ../src/infiltratr-common/src/i18n.c
      - path: ../src/infiltratr-common/src/token.c
      - path: ../src/infiltratr-common/src/timing.c
      - path: ../src/infiltratr-common/src/format.c
      - path: ../src/infiltratr-common/src/quantity.c
      - path: ../src/infiltratr-common/src/graphics.c
      - path: ../src/infiltratr-common/src/escape.c
      - path: ../src/infiltratr-common/src/design.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ssmith.infiltrator.calc
        PRODUCT_NAME: Calculator
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Calculator
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Bridge/Calculator-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../src/core"
          - "$(SRCROOT)/../src/infiltratr-common/include"
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
