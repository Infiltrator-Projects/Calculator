name: Calculator

options:
  bundleIdPrefix: net.ssmith.infiltrator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_C_LANGUAGE_STANDARD: "c11"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Calculator:
    type: application
    platform: iOS
    sources:
      # Calculator owns these cohesive source trees. XcodeGen discovers their
      # implementation/header members recursively, so adding a portable core
      # translation unit cannot silently become a second iOS build manifest.
      - path: Sources
      - path: Bridge
      - path: ../src/core
      - path: ../src/ui

      # Common is different: only its portable source set belongs in the iOS
      # target. The contract test derives this list from Common's own CMake and
      # fails if this explicit platform subset drifts.
      - path: ../src/infiltratr-common/src/core.c
      - path: ../src/infiltratr-common/src/arithmetic.c
      - path: ../src/infiltratr-common/src/config.c
      - path: ../src/infiltratr-common/src/i18n.c
      - path: ../src/infiltratr-common/src/token.c
      - path: ../src/infiltratr-common/src/timing.c
      - path: ../src/infiltratr-common/src/temporal.c
      - path: ../src/infiltratr-common/src/temporal_clock.c
      - path: ../src/infiltratr-common/src/format.c
      - path: ../src/infiltratr-common/src/quantity.c
      - path: ../src/infiltratr-common/src/graphics.c
      - path: ../src/infiltratr-common/src/escape.c
      - path: ../src/infiltratr-common/src/design.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ssmith.calculator
        PRODUCT_NAME: Calculator
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Calculator
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIAppFonts:
          - mb_corpo_s_text_regular.ttf
          - mb_corpo_s_text_bold.ttf
          - mb_corpo_a_title_cond_regular.ttf
          - mb_corpo_s_text_cond_bold.ttf
          - mb_corpo_a_screen_2_cond_regular.ttf
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Bridge/Calculator-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../src/core"
          - "$(SRCROOT)/../src/boost-multiprecision/include"
          - "$(SRCROOT)/../src/infiltratr-common/include"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "BOOST_MP_STANDALONE=1"
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Bundle canonical MB Corpo fonts
        script: '"${SRCROOT}/bundle-fonts.sh"'
        inputFiles:
          - "$(SRCROOT)/bundle-fonts.sh"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/mb_corpo_s_text_regular.ttf"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/mb_corpo_s_text_bold.ttf"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/mb_corpo_a_title_cond_regular.ttf"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/mb_corpo_s_text_cond_bold.ttf"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/mb_corpo_a_screen_2_cond_regular.ttf"
    scheme:
      gatherCoverageData: false
